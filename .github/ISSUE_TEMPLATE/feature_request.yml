name: ✨ Feature Request
description: Suggest an idea or UI capability for AgentEverywhereFlow-WebUI
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make the WebUI better? We'd love to hear your proposal!

  - type: textarea
    id: problem
    attributes:
      label: Problem or Motivation
      description: Is your feature request related to a problem or limitation?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / UI Design
      description: Describe what you would like to see happen.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you've considered.
