name: Release WebUI Bundle

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v0.1.0)'
        required: false
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  release:
    name: Build & Publish WebUI Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code Quality (oxlint)
        run: pnpm lint

      - name: Build production bundle
        run: pnpm build

      - name: Package dist into webui-dist.zip
        run: |
          cd dist
          zip -r ../webui-dist.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.tag || 'v0.1.0' }}
          files: webui-dist.zip
          generate_release_notes: true
